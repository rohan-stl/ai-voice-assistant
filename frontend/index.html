<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Shopping Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ─── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0b14;
      --surface:     #12141f;
      --surface2:    #1a1d2e;
      --border:      rgba(255,255,255,0.08);
      --accent:      #6c5ce7;
      --accent2:     #a29bfe;
      --green:       #00d68f;
      --red:         #ff6b6b;
      --text:        #e4e6f0;
      --muted:       #636687;
      --radius:      16px;
      --shadow:      0 8px 32px rgba(0,0,0,0.5);
    }

    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

    /* ─── Layout ────────────────────────────────────────────────── */
    .app {
      display: flex;
      height: 100vh;
      max-width: 1100px;
      margin: 0 auto;
      gap: 20px;
      padding: 20px;
    }

    /* ─── Main Chat Panel ───────────────────────────────────────── */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    /* Header */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 20px;
      background: linear-gradient(135deg, #1e1040 0%, #0f0c29 100%);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .chat-header .logo {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }

    .chat-header .title { font-size: 17px; font-weight: 700; }
    .chat-header .subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .header-actions { margin-left: auto; display: flex; gap: 8px; }

    .btn-icon {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      border-radius: 8px; width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 15px; transition: background 0.2s;
    }
    .btn-icon:hover { background: rgba(255,255,255,0.12); }

    /* Messages area */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Message bubbles */
    .msg { display: flex; gap: 10px; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .msg.ai .msg-avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .msg.user .msg-avatar { background: var(--surface2); }

    .msg-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
    }
    .msg.ai .msg-bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px 14px 14px 14px;
    }
    .msg.user .msg-bubble {
      background: linear-gradient(135deg, var(--accent) 0%, #8b7cf8 100%);
      color: white;
      border-radius: 14px 4px 14px 14px;
    }

    /* Stage badge */
    .stage-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
      padding: 3px 8px; border-radius: 20px; margin-bottom: 6px;
    }
    .stage-browse    { background: rgba(108,92,231,0.18); color: var(--accent2); }
    .stage-variant   { background: rgba(253,203,110,0.18); color: #fdcb6e; }
    .stage-confirm   { background: rgba(0,214,143,0.18); color: var(--green); }
    .stage-error     { background: rgba(255,107,107,0.18); color: var(--red); }

    /* ─── Product Grid ──────────────────────────────────────────── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .product-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
    }
    .product-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 6px 24px rgba(108,92,231,0.2); }
    .product-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(108,92,231,0.4); }

    .product-card-img {
      width: 100%; aspect-ratio: 1;
      object-fit: cover; background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; color: var(--muted);
    }
    .product-card-img img { width: 100%; height: 100%; object-fit: cover; }

    .product-card-body { padding: 10px; }
    .product-card-title { font-size: 12px; font-weight: 600; line-height: 1.4; color: var(--text); }
    .product-card-price { font-size: 13px; font-weight: 700; color: var(--accent2); margin-top: 4px; }
    .product-card-type  { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* Variant chips */
    .variants-row {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 10px;
    }

    .variant-chip {
      padding: 5px 11px; border-radius: 20px;
      font-size: 12px; font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
    }
    .variant-chip:hover { border-color: var(--accent); color: var(--accent2); }
    .variant-chip.available { color: var(--text); }
    .variant-chip.unavailable { color: var(--muted); text-decoration: line-through; cursor: default; }
    .variant-chip.selected { background: var(--accent); border-color: var(--accent); color: white; }

    /* ─── Confirm Card ──────────────────────────────────────────── */
    .confirm-card {
      background: linear-gradient(135deg, rgba(0,214,143,0.08) 0%, rgba(0,184,120,0.04) 100%);
      border: 1px solid rgba(0,214,143,0.25);
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }
    .confirm-card h4 { font-size: 13px; font-weight: 600; color: var(--green); margin-bottom: 10px; }
    .confirm-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .confirm-row span:first-child { color: var(--muted); }
    .confirm-row span:last-child { font-weight: 600; }
    .confirm-btns { display: flex; gap: 8px; margin-top: 14px; }

    .btn {
      padding: 9px 18px; border-radius: 10px;
      font-size: 13px; font-weight: 600;
      cursor: pointer; border: none;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    .btn:active { transform: scale(0.97); }

    .btn-confirm {
      background: linear-gradient(135deg, var(--green), #00b894);
      color: white; flex: 1;
    }
    .btn-confirm:hover { box-shadow: 0 4px 16px rgba(0,214,143,0.4); }

    .btn-cancel {
      background: var(--surface2); color: var(--muted);
      border: 1px solid var(--border); flex: 0 0 auto;
    }
    .btn-cancel:hover { color: var(--text); }

    /* ─── Cart Added Toast ──────────────────────────────────────── */
    .cart-success {
      background: linear-gradient(135deg, rgba(0,214,143,0.1), rgba(0,184,120,0.05));
      border: 1px solid rgba(0,214,143,0.3);
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .cart-success-icon { font-size: 24px; }
    .cart-success-text { font-size: 13px; line-height: 1.5; }
    .cart-success-text strong { color: var(--green); }

    /* ─── Input area ────────────────────────────────────────────── */
    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
    }

    .mic-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b7cf8);
      border: none; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      font-size: 18px; color: white; flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(108,92,231,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .mic-btn:hover { transform: scale(1.07); box-shadow: 0 6px 20px rgba(108,92,231,0.5); }
    .mic-btn.recording { background: linear-gradient(135deg, var(--red), #e84393); box-shadow: 0 4px 14px rgba(255,107,107,0.5); }
    .mic-btn.recording::after {
      content: ''; position: absolute;
      width: 100%; height: 100%; border-radius: 50%;
      border: 2px solid var(--red); animation: pulse 1.2s ease-out infinite;
    }
    @keyframes pulse { to { transform: scale(1.7); opacity: 0; } }

    .text-input {
      flex: 1; background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 24px; padding: 11px 18px;
      font-size: 14px; color: var(--text);
      font-family: 'Inter', sans-serif;
      outline: none; transition: border-color 0.2s;
      resize: none; line-height: 1.4;
    }
    .text-input:focus { border-color: var(--accent); }
    .text-input::placeholder { color: var(--muted); }

    .send-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b7cf8);
      border: none; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      font-size: 18px; color: white; flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(108,92,231,0.4);
      transition: transform 0.15s, opacity 0.15s;
    }
    .send-btn:hover { transform: scale(1.07); }
    .send-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

    /* Typing indicator */
    .typing { display: flex; align-items: center; gap: 5px; padding: 10px 0; }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s ease-in-out infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    /* ─── Cart Sidebar ──────────────────────────────────────────── */
    .cart-panel {
      width: 280px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    .cart-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .cart-header h3 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .cart-badge {
      background: var(--accent); color: white;
      font-size: 10px; font-weight: 700;
      border-radius: 20px; padding: 2px 7px; min-width: 20px; text-align: center;
    }

    .cart-items {
      flex: 1; overflow-y: auto; padding: 14px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .cart-item {
      display: flex; gap: 10px; align-items: center;
      padding: 10px; border-radius: 10px;
      background: var(--surface2); border: 1px solid var(--border);
    }
    .cart-item-img {
      width: 44px; height: 44px; border-radius: 8px;
      object-fit: cover; background: var(--bg); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cart-item-variant { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .cart-item-price { font-size: 12px; font-weight: 700; color: var(--accent2); margin-top: 3px; }
    .cart-item-qty { font-size: 10px; color: var(--muted); }

    .cart-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .cart-total { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .cart-total span:first-child { font-size: 13px; color: var(--muted); }
    .cart-total span:last-child { font-size: 18px; font-weight: 700; }

    .btn-checkout {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #8b7cf8);
      color: white; font-size: 14px; font-weight: 700;
      border: none; cursor: pointer;
      box-shadow: 0 4px 16px rgba(108,92,231,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-checkout:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(108,92,231,0.5); }
    .btn-checkout:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }

    .cart-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--muted); gap: 8px; padding: 20px;
    }
    .cart-empty-icon { font-size: 40px; opacity: 0.4; }
    .cart-empty-text { font-size: 13px; text-align: center; }

    /* ─── Storefront link ───────────────────────────────────────── */
    .storefront-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--accent2);
      text-decoration: none; margin-top: 8px;
      padding: 4px 10px; border-radius: 20px;
      border: 1px solid rgba(108,92,231,0.3);
      transition: background 0.15s;
    }
    .storefront-link:hover { background: rgba(108,92,231,0.1); }

    /* ─── Status bar ────────────────────────────────────────────── */
    .status-bar {
      padding: 8px 20px;
      font-size: 11px;
      color: var(--muted);
      background: var(--bg);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ─── Responsive ────────────────────────────────────────────── */
    @media (max-width: 700px) {
      .app { flex-direction: column; padding: 10px; }
      .cart-panel { width: 100%; max-height: 240px; }
    }

    /* Fade-in animation for messages */
    .msg { animation: fadeUp 0.25s ease; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* Markdown bold rendering in bubble */
    .msg-bubble b, .msg-bubble strong { font-weight: 700; color: white; }

    /* ─── Voice Modal Overlay ───────────────────────────────────── */
    .voice-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(10, 11, 20, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex; align-items: center; justify-content: center;
    }
    .voice-modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px 24px;
      width: 90%; max-width: 360px;
      text-align: center; position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .voice-modal-orb {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--red), #e84393);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      box-shadow: 0 0 30px rgba(255,107,107,0.5);
      animation: pulseOrb 1.4s ease-in-out infinite;
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(255,107,107,0.4); }
      50% { transform: scale(1.08); box-shadow: 0 0 45px rgba(255,107,107,0.7); }
    }
    .voice-modal-title { font-size: 18px; font-weight: 700; color: #fff; }
    .voice-modal-transcript { font-size: 14px; color: var(--muted); min-height: 40px; }
    .voice-modal-close {
      position: absolute; top: 12px; right: 14px;
      background: transparent; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer; padding: 4px 8px;
    }
    .voice-modal-close:hover { color: #fff; }
  </style>
</head>
<body>
<div class="app">

  <!-- ── Chat Panel ─────────────────────────────────────────── -->
  <div class="chat-panel">

    <div class="chat-header">
      <div class="logo">🛍️</div>
      <div>
        <div class="title">AI Shopping Assistant</div>
        <div class="subtitle">Powered by your Shopify store</div>
      </div>
      <div class="header-actions">
        <div class="btn-icon" id="resetBtn" title="New conversation">🔄</div>
      </div>
    </div>

    <div class="messages" id="messages">
      <!-- Welcome message injected by JS -->
    </div>

    <div class="status-bar" id="statusBar">Ready — tap 🎤 to speak or type below</div>

    <div class="input-area">
      <button class="mic-btn" id="micBtn" title="Tap to speak">🎤</button>
      <input
        class="text-input"
        id="textInput"
        type="text"
        placeholder="Ask me about products, sizes, prices…"
        autocomplete="off"
      />
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>

  <!-- ── Cart Sidebar ───────────────────────────────────────── -->
  <div class="cart-panel">
    <div class="cart-header">
      <h3>🛒 Cart <span class="cart-badge" id="cartBadge">0</span></h3>
    </div>

    <div class="cart-items" id="cartItems">
      <div class="cart-empty">
        <div class="cart-empty-icon">🛒</div>
        <div class="cart-empty-text">Your cart is empty.<br/>Ask me to find something!</div>
      </div>
    </div>

    <div class="cart-footer" id="cartFooter" style="display:none">
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">$0.00</span>
      </div>
      <div style="font-size:10px;color:var(--muted);text-align:center;margin-bottom:6px;">
        ⚠️ Use the button below to checkout — the store cart icon is separate.
      </div>
      <button class="btn-checkout" id="checkoutBtn" disabled>Proceed to Checkout →</button>
    </div>
  </div>

</div>

<!-- ── Voice Listening Overlay Modal ───────────────────────── -->
<div class="voice-modal-overlay" id="voiceModal" style="display:none;">
  <div class="voice-modal-card">
    <button class="voice-modal-close" id="closeVoiceModalBtn">✕</button>
    <div class="voice-modal-orb">🎙️</div>
    <div class="voice-modal-title">Listening…</div>
    <div class="voice-modal-transcript" id="voiceModalTranscript">Speak now, e.g. &ldquo;Show me T-shirts under $50&rdquo;</div>
    <button class="btn btn-cancel" id="cancelVoiceBtn" style="margin-top:8px;">Stop Listening</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────
// Config — filled from page globals when embedded in Shopify
// ─────────────────────────────────────────────────────────
const CONFIG = {
  apiBase: window.AI_ASSISTANT_API_BASE || "http://localhost:8000",
  shopDomain: window.Shopify?.shop || "",
  storefrontToken: window.AI_ASSISTANT_STOREFRONT_TOKEN || "",
  adminToken: window.AI_ASSISTANT_ADMIN_TOKEN || "",
};

// ─────────────────────────────────────────────────────────
// Session — persisted across page refreshes
// ─────────────────────────────────────────────────────────
let sessionId = localStorage.getItem("ai_session_id");
if (!sessionId) {
  sessionId = "sess_" + Math.random().toString(36).slice(2, 10) + Date.now();
  localStorage.setItem("ai_session_id", sessionId);
}

// ─────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────
let isProcessing = false;
let mediaRecorder = null;
let audioChunks = [];
let currentStage = "browse";
let cartData = null;
let currentAudio = null;

const $messages   = document.getElementById("messages");
const $textInput  = document.getElementById("textInput");
const $sendBtn    = document.getElementById("sendBtn");
const $micBtn     = document.getElementById("micBtn");
const $statusBar  = document.getElementById("statusBar");
const $cartItems  = document.getElementById("cartItems");
const $cartBadge  = document.getElementById("cartBadge");
const $cartFooter = document.getElementById("cartFooter");
const $cartTotal  = document.getElementById("cartTotal");
const $checkoutBtn= document.getElementById("checkoutBtn");
const $resetBtn   = document.getElementById("resetBtn");

// ─────────────────────────────────────────────────────────
// Message rendering helpers
// ─────────────────────────────────────────────────────────
function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function renderMarkdown(str) {
  return escapeHtml(str)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n/g, "<br/>");
}

function appendMsg(role, html) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="msg-avatar">${role === "ai" ? "🤖" : "👤"}</div>
    <div class="msg-bubble">${html}</div>
  `;
  $messages.appendChild(div);
  $messages.scrollTop = $messages.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "msg ai";
  div.id = "typing-indicator";
  div.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-bubble">
      <div class="typing">

// Stage badge

function stageBadge(stage) {
  const labels = {
    browse:           ["🔍 Browsing",      "stage-browse"],
    awaiting_variant: ["✋ Choose Option",  "stage-variant"],
    awaiting_confirm: ["✅ Confirm",        "stage-confirm"],
    done:             ["✅ Added",          "stage-confirm"],

  return `<span class="stage-badge ${cls}">${label}</span><br/>`;

// ─────────────────────────────────────────────────────────
// Product cards
// ─────────────────────────────────────────────────────────
function renderProducts(products, stage) {
  if (!products || products.length === 0) return "";

  const cards = products.slice(0, 12).map(p => {
    const variants = (p.variants?.nodes || []);
    const minPrice = Math.min(...variants.map(v => parseFloat(v.price || 0)));
    const imgUrl = p.featuredImage?.url || "";
    const imgHtml = imgUrl
      ? `<img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(p.title)}" loading="lazy" />`
      : `<span>${productEmoji(p.productType)}</span>`;

    const variantChips = variants.slice(0, 6).map(v => {
      const avail = v.availableForSale;
      return `<span class="variant-chip ${avail ? "available" : "unavailable"}"
               data-variant-id="${escapeHtml(v.id)}"
               data-product="${escapeHtml(p.title)}"
               data-variant="${escapeHtml(v.title)}"
               data-price="${escapeHtml(v.price)}"
               data-avail="${avail}"
               title="${avail ? "In stock" : "Out of stock"}"
               onclick="handleVariantChipClick(this)">
               ${escapeHtml(v.title)}
             </span>`;
    }).join("");

    return `
      <div class="product-card" onclick="handleProductClick(this)"
           data-product='${JSON.stringify({id: p.id, title: p.title, productType: p.productType, vendor: p.vendor, handle: p.handle, onlineStoreUrl: p.onlineStoreUrl, featuredImage: p.featuredImage, variants: p.variants}).replace(/'/g, "&#39;")}'>
        <div class="product-card-img">${imgHtml}</div>
        <div class="product-card-body">
          <div class="product-card-title">${escapeHtml(p.title)}</div>
          <div class="product-card-price">From $${minPrice.toFixed(2)}</div>
          <div class="product-card-type">${escapeHtml(p.productType || p.vendor || "")}</div>
          ${variants.length > 0 ? `<div class="variants-row">${variantChips}</div>` : ""}
        </div>
      </div>
    `;
  }).join("");

  return `<div class="products-grid">${cards}</div>`;
}

function productEmoji(type) {
  const map = { "T-Shirt": "👕", "Snowboard": "🏂", "Shoes": "👟", "Hoodie": "🧥", "Pants": "👖", "Hat": "🧢", "Bag": "👜" };
  return map[type] || "🛍️";
}

// ─────────────────────────────────────────────────────────
// Sync item to native Shopify theme cart via /cart/add.js
// Only works when widget is embedded on the Shopify domain.
// ─────────────────────────────────────────────────────────
async function syncToThemeCart(cart) {
  try {
    if (!cart || !cart.lines || cart.lines.length === 0) return;
    const lastLine = cart.lines[cart.lines.length - 1];
    if (!lastLine || !lastLine.variant_id) return;

    const rawId = String(lastLine.variant_id);
    const numericId = rawId.includes("/") ? parseInt(rawId.split("/").pop(), 10) : parseInt(rawId, 10);
    if (!numericId || isNaN(numericId)) return;

    const resp = await fetch("/cart/add.js", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Requested-With": "XMLHttpRequest" },
      body: JSON.stringify({ items: [{ id: numericId, quantity: lastLine.quantity || 1 }] }),
    });

    if (!resp.ok) { console.warn("[AI Cart] /cart/add.js returned", resp.status); return; }

    const cartResp = await fetch("/cart.js");
    if (cartResp.ok) {
      const nativeCart = await cartResp.json();
      const count = nativeCart.item_count || 0;
      document.querySelectorAll(
        ".cart-count-bubble, .cart__count, [data-cart-count], .header__icon--cart .badge, .cart-count"
      ).forEach(el => { el.textContent = count; if (count > 0) el.removeAttribute("hidden"); });
      console.log(`[AI Cart] Synced to native cart — ${count} item(s)`);
    }
  } catch (err) {
    console.warn("[AI Cart] Native cart sync skipped (not on Shopify domain):", err.message);
  }
}

// ─────────────────────────────────────────────────────────
// Process API response
// ─────────────────────────────────────────────────────────
function processResponse(data, userMessage) {
  currentStage = data.stage || "browse";

  let html = stageBadge(currentStage);
  html += renderMarkdown(data.answer || "");

  // Confirm card
  if (currentStage === "awaiting_confirm" && data.selected_product && data.selected_variant) {
    html += renderConfirmCard(data.selected_product, data.selected_variant, data.quantity || 1);
  }

  // Products grid
  if (data.products && data.products.length > 0) {
    html += renderProducts(data.products, currentStage);
  }

  // Cart success
  if (data.cart) {
    html += renderCartSuccess(data.cart);
    updateCartSidebar(data.cart);
    syncToThemeCart(data.cart);
  }

  // Storefront link
  if (data.storefront_url) {
    html += `<br/><a class="storefront-link" href="${escapeHtml(data.storefront_url)}" target="_blank">🔗 View on store</a>`;
  }

  appendMsg("ai", html);

  // Speech — use ElevenLabs server audio if available, else browser TTS (always works, free)
  if (data.audio) {
    playBase64Audio(data.audio);
  } else {
    // Browser Web Speech Synthesis fallback — works in Chrome, Safari, Edge
  // Close voice listening modal if server signals close_widget or auto_close
  if (data.close_widget || data.auto_close || data.immediate_close) {
    if (isListening) stopListening();
  }
}

// ─────────────────────────────────────────────────────────

async function sendMessage(text) {
  const message = (text || $textInput.value).trim();
  if (!message || isProcessing) return;

  $textInput.value = "";
  setProcessing(true);

  appendMsg("user", escapeHtml(message));
  showTyping();

  try {
    const res = await fetch(`${CONFIG.apiBase}/voice-text`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message,
        session_id: sessionId,
        shop_domain: CONFIG.shopDomain || undefined,
        storefront_token: CONFIG.storefrontToken || undefined,
        admin_token: CONFIG.adminToken || undefined,
      }),
    });

    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const data = await res.json();
    removeTyping();
    processResponse(data, message);

  } catch (err) {
    removeTyping();
    appendMsg("ai", "⚠️ Something went wrong. Please check that the backend is running.");
    setStatus("Error — check backend connection");
    console.error(err);
  } finally {
    setProcessing(false);
  }
}

// ─────────────────────────────────────────────────────────
// Voice — Web Speech API (PRIMARY, free, instant, works for single words)
//         Falls back to MediaRecorder → server for unsupported browsers
// ─────────────────────────────────────────────────────────

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

function buildRecognition() {
  if (!SpeechRecognition) return null;
  const r = new SpeechRecognition();
  r.lang = "en-US";
  r.continuous = false;     // Auto-stops after one utterance — perfect for commands
  r.interimResults = true;  // Show live partial transcript in status bar
  r.maxAlternatives = 1;

  // Show live partial transcript so user sees what's being heard in real time
  r.onresult = (event) => {
    let interim = "", final = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) final += t;
      else interim += t;
    }
    if (interim) setStatus(`🎙️ Hearing: "${interim}"`);
    if (final) {
      const text = final.trim();
      if (text) {
        setStatus(`✅ Heard: "${text}"`);
        stopListening();
        dispatchVoiceText(text);
      }
    }
  };

  r.onerror = (event) => {
    stopListening();
    console.error("[SpeechRecognition] error:", event.error);
    if (event.error === "no-speech") {
      setStatus("🔇 No speech detected — tap 🎤 and speak clearly");
    } else if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      setStatus("🚫 Microphone blocked — allow mic in browser settings");
      showMicError("Microphone access was denied.\n\nTo fix this:\n1. Click the 🔒 lock icon in your browser's address bar\n2. Set Microphone to \"Allow\"\n3. Reload the page");
    } else if (event.error === "network") {
      setStatus("⚠️ Network error with voice service — please type instead");
    } else {
      setStatus(`⚠️ Voice error: ${event.error} — please type instead`);
    }
  };

  r.onend = () => {
    if (isListening) stopListening();
  };

  return r;
}

const $voiceModal = document.getElementById("voiceModal");
const $voiceModalTranscript = document.getElementById("voiceModalTranscript");
const $closeVoiceModalBtn = document.getElementById("closeVoiceModalBtn");
const $cancelVoiceBtn = document.getElementById("cancelVoiceBtn");

if ($closeVoiceModalBtn) $closeVoiceModalBtn.onclick = () => stopListening();
if ($cancelVoiceBtn) $cancelVoiceBtn.onclick = () => stopListening();

async function startListening() {
  if (isProcessing) {
    setStatus("⏳ Please wait — still processing previous request");
    return;
  }

  // First check if mic permission is granted / promptable
  if (navigator.permissions) {
    try {
      const perm = await navigator.permissions.query({ name: "microphone" });
      if (perm.state === "denied") {
        setStatus("🚫 Microphone blocked — allow mic in browser settings and reload");
        showMicError("Microphone access is blocked. Please click the 🔒 icon in your browser's address bar, allow the microphone, then reload the page.");
        return;
      }
    } catch (_) { /* permissions API not available — proceed anyway */ }
  }

  recognition = buildRecognition();

  if (recognition) {
    // Primary path: Web Speech API
    isListening = true;
    $micBtn.classList.add("recording");
    $micBtn.textContent = "⏹";
    if ($voiceModal) {
      $voiceModal.style.display = "flex";
      if ($voiceModalTranscript) $voiceModalTranscript.textContent = "Speak now, e.g. \"Show me T-shirts under $50\"";
    }
    setStatus("🔴 Listening… speak now, tap ⏹ to cancel");
    try {
      recognition.start();
    } catch (e) {
      stopListening();
      setStatus("⚠️ Could not start microphone — " + (e.message || "unknown error"));
      console.error("[Mic] recognition.start() failed:", e);
    }
  } else {
    // Fallback: MediaRecorder → server STT
    if ($voiceModal) {
      $voiceModal.style.display = "flex";
      if ($voiceModalTranscript) $voiceModalTranscript.textContent = "Recording audio… speak now";
    }
    setStatus("🎙️ Starting microphone (fallback mode)…");
    startMediaRecorder();
  }
}

function stopListening() {
  isListening = false;
  $micBtn.classList.remove("recording");
  $micBtn.textContent = "🎤";
  if ($voiceModal) $voiceModal.style.display = "none";
  if (recognition) {
    try { recognition.stop(); } catch (e) {}
    recognition = null;
  }
}

// Called when Web Speech API returns a final transcript
async function dispatchVoiceText(text) {
  appendMsg("user", `🎙️ ${escapeHtml(text)}`);
  setStatus(`🎙️ Heard: "${text}" — processing…`);
  setProcessing(true);
  showTyping();

  try {
    const res = await fetch(`${CONFIG.apiBase}/voice-text`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        session_id: sessionId,
        shop_domain: CONFIG.shopDomain || undefined,
        storefront_token: CONFIG.storefrontToken || undefined,
        admin_token: CONFIG.adminToken || undefined,
      }),
    });

    if (!res.ok) throw new Error(`Server error ${res.status}`);
    const data = await res.json();
    removeTyping();
    processResponse(data, text);
    setStatus(`Stage: ${currentStage}`);
  } catch (err) {
    removeTyping();
    appendMsg("ai", "⚠️ Something went wrong. Please check the backend is running.");
    setStatus("❌ Error — check backend connection");
    console.error(err);
  } finally {
    setProcessing(false);
  }
}

// Fallback: MediaRecorder → server STT (for Firefox and older browsers)
async function startMediaRecorder() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);

    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      $micBtn.classList.remove("recording");
      $micBtn.textContent = "🎤";
      setStatus("⏳ Processing audio…");
      setProcessing(true);
      showTyping();

      const blob = new Blob(audioChunks, { type: "audio/webm" });
      const form = new FormData();
      form.append("file", blob, "recording.webm");
      form.append("session_id", sessionId);
      if (CONFIG.shopDomain) form.append("shop_domain", CONFIG.shopDomain);
      if (CONFIG.storefrontToken) form.append("storefront_token", CONFIG.storefrontToken);
      if (CONFIG.adminToken) form.append("admin_token", CONFIG.adminToken);

      try {
        const res = await fetch(`${CONFIG.apiBase}/voice`, { method: "POST", body: form });
        if (!res.ok) throw new Error(`Server error ${res.status}`);
        const data = await res.json();
        removeTyping();

        // Server signals STT quota exhausted — guide user to type
        if (data.use_browser_stt) {
          setStatus("⚠️ Voice quota exhausted — please type your message below");
          appendMsg("ai", "⚠️ My voice transcription service is currently unavailable. Please <strong>type</strong> your message in the box below!");
          setProcessing(false);
          $textInput.focus();
          return;
        }

        if (data.transcription) {
          appendMsg("user", `🎙️ ${escapeHtml(data.transcription.trim())}`);
          setStatus(`🎙️ Heard: "${data.transcription.trim()}"`);
        }
        processResponse(data, data.transcription);
        setStatus(`Stage: ${currentStage}`);
      } catch (err) {
        removeTyping();
        appendMsg("ai", "⚠️ Could not process voice input. Please type your message instead.");
        setStatus("❌ Voice error — please type instead");
        console.error(err);
      } finally {
        setProcessing(false);
      }
    };

    mediaRecorder.start();
    $micBtn.classList.add("recording");
    $micBtn.textContent = "⏹";
    setStatus("🔴 Recording… tap ⏹ to stop");
  } catch (err) {
    console.error("[MediaRecorder] getUserMedia failed:", err);
    setStatus("🚫 Microphone access denied — check browser permissions");
    showMicError("Could not access your microphone.\n\nError: " + (err.message || err) + "\n\nTo fix this:\n1. Click the 🔒 lock icon in your address bar\n2. Set Microphone to \"Allow\"\n3. Reload the page");
  }
}

// ─────────────────────────────────────────────────────────
// Audio playback — ElevenLabs base64 OR browser TTS fallback
// ─────────────────────────────────────────────────────────
function playBase64Audio(b64) {
  try {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const blob = new Blob([bytes], { type: "audio/mpeg" });
    const url = URL.createObjectURL(blob);
    currentAudio = new Audio(url);
    currentAudio.volume = 1.0;  // Max system volume
    currentAudio.onended = () => URL.revokeObjectURL(url);

    // Use Web Audio API GainNode to amplify beyond default if needed
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const source = ctx.createMediaElementSource(currentAudio);
      const gain = ctx.createGain();
      gain.gain.value = 1.5;  // 1.5× amplification — increase further if still too quiet
      source.connect(gain);
      gain.connect(ctx.destination);
    } catch (_) { /* fallback: plays at system volume without gain */ }

    currentAudio.play().catch(() => {});
  } catch {}
}

// ── Browser TTS via Web Speech Synthesis ─────────────────
// Works in Chrome, Safari, Edge — completely free, no quota.
// Handles the autoplay policy by unlocking on first user gesture.
let _ttsUnlocked = false;
let _voicesLoaded = false;

function _loadVoices() {
  const v = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  if (v.length > 0) _voicesLoaded = true;
  return v;
}

if (window.speechSynthesis) {
  _loadVoices();
  window.speechSynthesis.onvoiceschanged = () => { _voicesLoaded = true; _loadVoices(); };
}

// Unlock TTS on any first user interaction (required by browsers)
function _unlockTTS() {
  if (_ttsUnlocked || !window.speechSynthesis) return;
  _ttsUnlocked = true;
  // Speak a silent utterance to unlock the audio context
  const u = new SpeechSynthesisUtterance(" ");
  u.volume = 0;
  u.rate = 10;
  window.speechSynthesis.speak(u);
}
["click", "keydown", "touchstart", "pointerdown"].forEach(evt =>
  document.addEventListener(evt, _unlockTTS, { once: false, passive: true })
);

function speakText(text) {
  if (!window.speechSynthesis) return;

  // Strip markdown and emoji for natural speech
  const clean = text
    .replace(/\*\*(.*?)\*\*/g, "$1")
    .replace(/\*(.*?)\*/g, "$1")
    .replace(/[✅❌⚠️🎉🔍🛒🎙️👋📦💬✋🤖👤🏂👕🛍️💳]/g, "")
    .replace(/https?:\/\/\S+/g, "")     // Remove URLs
    .replace(/\s+/g, " ")
    .trim();

  if (!clean) return;

  window.speechSynthesis.cancel();

  const speak = () => {
    const utter = new SpeechSynthesisUtterance(clean);
    utter.lang = "en-US";
    utter.rate = 0.95;    // Slightly slower = clearer & perceived as louder
    utter.pitch = 1.0;
    utter.volume = 1.0;   // Maximum browser TTS volume

    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v =>
      v.lang.startsWith("en") &&
      (v.name.includes("Samantha") || v.name.includes("Daniel") ||
       v.name.includes("Karen") || v.name.includes("Moira") ||
       v.name.includes("Google US") || v.name.includes("Google UK"))
    ) || voices.find(v => v.lang === "en-US" && !v.localService === false)
      || voices.find(v => v.lang.startsWith("en"));
    if (preferred) utter.voice = preferred;

    window.speechSynthesis.speak(utter);
  };

  // If voices not loaded yet, wait a tick and retry
  if (_voicesLoaded) {
    speak();
  } else {
    setTimeout(speak, 300);
  }
}

// ─────────────────────────────────────────────────────────
// UI helpers
// ─────────────────────────────────────────────────────────
function setProcessing(val) {
  isProcessing = val;
  $sendBtn.disabled = val;
  $textInput.disabled = val;
}

function setStatus(msg) {
  $statusBar.textContent = msg;
}

$sendBtn.addEventListener("click", () => sendMessage());
$textInput.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

$resetBtn.addEventListener("click", async () => {
  if (!confirm("Start a new conversation? This won't clear your cart.")) return;
  await fetch(`${CONFIG.apiBase}/session/reset?session_id=${sessionId}`, { method: "POST" }).catch(() => {});
  $messages.innerHTML = "";
  currentStage = "browse";
  appendWelcome();
  setStatus("Conversation reset — ready");
});

$checkoutBtn.addEventListener("click", () => {
  if (cartData?.checkout_url) window.open(cartData.checkout_url, "_blank");
});

function appendWelcome() {
  appendMsg("ai",
    `<span class="stage-badge stage-browse">🔍 Ready</span><br/>
    Hi! I'm your AI shopping assistant. 👋<br/><br/>
    You can <strong>tap the 🎤 mic and speak</strong>, or type:<br/>
    • <em>"Show me T-shirts under $50"</em><br/>
    • <em>"Find a blue snowboard"</em><br/>
    • <em>"Add size M to my cart"</em><br/><br/>
    What are you looking for today?`
  );
}

// ─────────────────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────────────────
appendWelcome();

// Show a friendly note if browser doesn't support Web Speech API
if (!SpeechRecognition) {
  setStatus("ℹ️ Voice not supported in this browser — please type your request");
  $micBtn.title = "Voice input not supported in this browser — use Chrome, Edge or Safari";
  $micBtn.style.opacity = "0.5";
} else {
  setStatus(`Ready — tap 🎤 to speak or type below`);
}

// ── Mic permission helper ──────────────────────────────────────
function showMicError(msg) {
  // Show in status bar
  setStatus("🚫 " + msg.split("\n")[0]);
  // Also show a non-blocking toast in the chat
  const div = document.createElement("div");
  div.className = "msg ai";
  div.innerHTML = `
    <div class="msg-avatar">🤖</div>
    <div class="msg-bubble" style="background:rgba(255,107,107,0.12);border-color:rgba(255,107,107,0.3);">
      <strong style="color:#ff6b6b;">🚫 Microphone Access Issue</strong><br/><br/>
      ${escapeHtml(msg).replace(/\n/g, "<br/>")}
    </div>
  `;
  $messages.appendChild(div);
  $messages.scrollTop = $messages.scrollHeight;
}
</script>
</body>
</html>
